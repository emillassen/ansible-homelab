---
vmid: 121
cores: 1
memory: 512
disk_gb: 4
mac_temp: "BC:24:11:D7:28:64"
mac_production: "BC:24:11:8B:B1:B4"
ip_production: 192.168.1.113
ip_static: false
startup: ""
net_production: true
# Set to the temporary DHCP address after provision, back to ip_production at cutover.
ansible_host: 192.168.1.113
ufw_allow:
  - port: "8443"
    proto: tcp
    from: "{{ web_client_sources }}"
  - port: "8080"
    proto: tcp
    from: "{{ web_client_sources }}"

# run verify (playbooks/verify.yml)
verify_units: [nginx]
verify_http:
  - url: https://127.0.0.1:8443/
  - url: http://127.0.0.1:8080/
    status: 301
