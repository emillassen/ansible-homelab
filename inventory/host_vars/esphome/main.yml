---
vmid: 125
cores: 4
memory: 4096
disk_gb: 10
mac_temp: "BC:24:11:A9:38:B1"
mac_production: "BC:24:11:CD:64:F0"
ip_production: 192.168.1.107
ip_static: false
startup: ""
net_production: true
# Set to the temporary DHCP address after provision, back to ip_production at cutover.
ansible_host: 192.168.1.107
ufw_allow:
  - port: "6052"
    proto: tcp
    from: "{{ web_client_sources }}"
  - port: "6055"
    proto: tcp
    from: "{{ admin_sources }}"
  - port: "5353"
    proto: udp

# run verify (playbooks/verify.yml)
# The Zigbee coordinator Zigbee2MQTT uses: flashed last, after the others succeeded.
esphome_update_last:
  - tubeszb-cc2652-p7-poe-2023.yaml

verify_units: [esphome]
verify_http:
  - url: http://127.0.0.1:6052/
