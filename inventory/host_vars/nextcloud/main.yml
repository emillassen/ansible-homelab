---
vmid: 215
cores: 4
memory: 8192
# The clone is 32 GB; grown to 64 by hand (roles/nextcloud/README.md).
disk_gb: 64
mac_temp: "BC:24:11:36:DF:C4"
mac_production: "BC:24:11:F7:63:2A"
ip_production: 192.168.1.121
ip_static: false
startup: ""
net_production: true
# Set to the temporary DHCP address after provision, back to ip_production at cutover.
ansible_host: 192.168.1.121
# AIO creates its own containers, so the daemon default would be the only way to set
# their log driver; they log to json-file, as before.
docker_loki_default: false
# Nextcloud trusts Caddy's X-Forwarded-For, so only Caddy may reach Apache. 8080 is the
# AIO interface, which drives Docker through the socket (root on this VM): admin only.
docker_user_filter:
  - {port: 11000, allow: 192.168.1.88}
  - {port: 8080, allow: "{{ admin_sources }}"}
# 3478 is Talk's TURN server (AIO's own port), for Talk clients on the LAN.
docker_published_open: [3478]

# run verify (playbooks/verify.yml)
verify_http:
  - url: http://127.0.0.1:11000/status.php
# AIO starts watchtower for its 05:00 update; it exits when done.
verify_docker_exited_ok: [nextcloud-aio-watchtower]
