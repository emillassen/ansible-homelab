---
vmid: 124
cores: 1
memory: 1024
disk_gb: 4
mac_temp: "BC:24:11:41:DE:68"
mac_production: "BC:24:11:C4:35:B9"
ip_production: 192.168.1.117
ip_static: false
startup: "order=9"
net_production: true
# Set to the temporary DHCP address after provision, back to ip_production at cutover.
ansible_host: 192.168.1.117
ufw_allow:
  - port: "3001"
    proto: tcp
    # Plus the controller, whose nightly verify pushes to :3001 (controller_verify_push_url).
    from: "{{ web_client_sources + [hostvars['ansible-controller'].ansible_host] }}"

# run verify (playbooks/verify.yml)
verify_units: [uptime-kuma]
verify_http:
  - url: http://127.0.0.1:3001/
    status: 302
