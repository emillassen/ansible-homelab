---
vmid: 118
cores: 1
memory: 1024
disk_gb: 8
mac_temp: "BC:24:11:EB:BD:23"
mac_production: "BC:24:11:BF:D9:1A"
ip_production: 192.168.1.102
ip_static: true
startup: ""
net_production: true
# Set to the temporary DHCP address after provision, back to ip_production at cutover.
ansible_host: 192.168.1.102
ufw_allow:
  - port: "51820"
    proto: udp
  - port: "10086"
    proto: tcp
ufw_routed: allow

# run verify (playbooks/verify.yml)
verify_units: [wg-dashboard]
verify_http:
  - url: http://127.0.0.1:10086/
# The dashboard brings wg0 up, not wg-quick@wg0.
verify_interfaces: [wg0]
