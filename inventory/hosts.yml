---
# A host joins `managed` in the commit after it has been provisioned.
# `site.yml` only touches `managed`; `legacy` is the old guests, used only to copy data.
all:
  children:
    managed:
      hosts:
        ansible-controller:
        smokeping:
        mosquitto:
        myspeed:
        uptime-kuma:
        bentopdf:
        homepage:
        zigbee2mqtt:
        esphome:
        jellyfin:
    lxc:
      hosts:
        ansible-controller:
        test-lxc:
        smokeping:
        mosquitto:
        zigbee2mqtt:
        myspeed:
        uptime-kuma:
        bentopdf:
        homepage:
        esphome:
        jellyfin:
        wireguard:
        caddy:
        adguard:
    vm:
      hosts:
        test-vm:
      children:
        docker:
          hosts:
            changedetection:
            grafana-loki:
            meshmonitor:
            miniflux-linkding:
            audiobookshelf:
            paperless:
            immich:
            nextcloud:
    legacy:
      children:
        legacy_lxc:
          hosts:
            adguard-old:
              ansible_host: 192.168.1.101
            wireguard-old:
              ansible_host: 192.168.1.102
            bentopdf-old:
              ansible_host: 192.168.1.113
            mosquitto-old:
              ansible_host: 192.168.1.105
              migrate_roles: [mosquitto]
            zigbee2mqtt-old:
              ansible_host: 192.168.1.106
              migrate_roles: [zigbee2mqtt]
            esphome-old:
              ansible_host: 192.168.1.107
              migrate_roles: [esphome]
            homepage-old:
              ansible_host: 192.168.1.108
              migrate_roles: [homepage]
            smokeping-old:
              ansible_host: 192.168.1.109
            myspeed-old:
              ansible_host: 192.168.1.110
              migrate_roles: [myspeed]
            changedetection-old:
              ansible_host: 192.168.1.112
            caddy-old:
              ansible_host: 192.168.1.88
            jellyfin-old:
              ansible_host: 192.168.1.115
              migrate_roles: [jellyfin]
            uptime-kuma-old:
              ansible_host: 192.168.1.117
              migrate_roles: [uptime_kuma]
        legacy_vm:
          hosts:
            immich-old:
              ansible_host: 192.168.1.111
            miniflux-linkding-old:
              ansible_host: 192.168.1.114
            audiobookshelf-old:
              ansible_host: 192.168.1.116
            grafana-loki-old:
              ansible_host: 192.168.1.118
            paperless-old:
              ansible_host: 192.168.1.119
            nextcloud-old:
              ansible_host: 192.168.1.121
            meshmonitor-old:
              ansible_host: 192.168.1.201
