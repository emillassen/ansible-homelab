---
# A host joins `managed` in the commit after it has been provisioned.
# `site.yml` only touches `managed`; `legacy` is the old guests, used only to copy data.
all:
  children:
    managed:
      hosts:
        ansible-controller:
        smokeping:
        mosquitto:
        myspeed:
        uptime-kuma:
        bentopdf:
        homepage:
        zigbee2mqtt:
        esphome:
        jellyfin:
        wireguard:
        caddy:
        adguard:
        changedetection:
        grafana-loki:
        meshmonitor:
        miniflux-linkding:
        audiobookshelf:
        paperless:
        immich:
        nextcloud:
    lxc:
      hosts:
        ansible-controller:
        smokeping:
        mosquitto:
        zigbee2mqtt:
        myspeed:
        uptime-kuma:
        bentopdf:
        homepage:
        esphome:
        jellyfin:
        wireguard:
        caddy:
        adguard:
    vm:
      children:
        docker:
          hosts:
            changedetection:
            grafana-loki:
            meshmonitor:
            miniflux-linkding:
            audiobookshelf:
            paperless:
            immich:
            nextcloud:
    # A rebuild adds the old guest here as <host>-old (README "Rebuild a guest").
    legacy:
      children:
        legacy_lxc:
          hosts: {}
        legacy_vm:
          hosts: {}
