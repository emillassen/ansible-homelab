---
- name: Base
  hosts: managed
  gather_facts: false
  pre_tasks:
    # A fresh guest opens port 22 before logins are allowed (pam_nologin).
    - name: Wait until the guest accepts a login
      ansible.builtin.wait_for_connection:
        timeout: 300
      # Skipped under --check otherwise, and check would hit the boot window.
      check_mode: false

    - name: Gather facts
      ansible.builtin.setup:
  roles:
    - base

- name: Firewall
  hosts: managed:&lxc
  roles:
    - ufw

- name: Docker
  hosts: managed:&docker
  roles:
    - docker_host

- name: Controller
  hosts: managed:&ansible-controller
  roles:
    - controller

- name: Smokeping
  hosts: managed:&smokeping
  roles:
    - smokeping

- name: Mosquitto
  hosts: managed:&mosquitto
  roles:
    - mosquitto

- name: MySpeed
  hosts: managed:&myspeed
  roles:
    - myspeed

- name: Uptime Kuma
  hosts: managed:&uptime-kuma
  roles:
    - uptime_kuma

- name: BentoPDF
  hosts: managed:&bentopdf
  roles:
    - bentopdf

- name: Homepage
  hosts: managed:&homepage
  roles:
    - nodejs
    - homepage

- name: Zigbee2MQTT
  hosts: managed:&zigbee2mqtt
  roles:
    - nodejs
    - zigbee2mqtt

- name: ESPHome
  hosts: managed:&esphome
  roles:
    - esphome

- name: Jellyfin
  hosts: managed:&jellyfin
  roles:
    - jellyfin

- name: WireGuard
  hosts: managed:&wireguard
  roles:
    - wireguard

- name: Caddy
  hosts: managed:&caddy
  roles:
    - caddy

- name: AdGuard Home
  hosts: managed:&adguard
  roles:
    - adguard

- name: Change Detection
  hosts: managed:&changedetection
  roles:
    - changedetection

- name: Grafana and Loki
  hosts: managed:&grafana-loki
  roles:
    - loki
