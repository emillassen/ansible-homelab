---
# Read-only health check of every managed guest: `run verify [--limit PATTERN]`.
# Nothing here changes a guest. A host fails when any check fails, and its message lists
# every problem found, not only the first.
#
# Per-host checks live in host_vars (all optional):
#   verify_units:      systemd units that must be active
#   verify_http:       [{url, status (default 200), headers}] fetched on the guest itself,
#                      redirects not followed and certificates not checked
#   verify_tcp:        ports that must accept a connection on 127.0.0.1
#   verify_interfaces: network links that must be up
#   verify_docker_exited_ok: containers allowed to be stopped (one-shot jobs)
# Every guest also gets: no failed units, local disks under verify_disk_max_pct, no
# reboot pending for over a day, no service left on replaced libraries (needrestart), and (Docker hosts) every container running and not unhealthy,
# every published port in docker_user_filter or docker_published_open, and DOCKER-USER
# holding exactly those rules, entered first from FORWARD.
- name: Verify
  hosts: managed
  gather_facts: false
  vars:
    verify_disk_max_pct: 80
    # unattended-upgrades reboots at 02:00, so a newer request is expected, not a problem.
    verify_reboot_max_age_h: 26
  tasks:
    - name: List failed units
      ansible.builtin.command: systemctl list-units --failed --no-legend --plain
      register: verify_failed
      changed_when: false
      check_mode: false

    - name: Check the required units
      ansible.builtin.command: systemctl is-active {{ item }}
      loop: "{{ verify_units | default([]) }}"
      register: verify_unit_state
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Measure local disks
      ansible.builtin.command: >-
        df -l --output=pcent,target -x tmpfs -x devtmpfs -x overlay -x squashfs -x efivarfs
      register: verify_df
      changed_when: false
      check_mode: false

    - name: Look for a pending reboot
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: verify_reboot

    # -r l lists only; the config would otherwise restart them.
    - name: List services on replaced libraries
      ansible.builtin.command: needrestart -b -r l
      register: verify_needrestart
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Fetch the HTTP endpoints
      ansible.builtin.uri:
        url: "{{ item.url }}"
        headers: "{{ item.headers | default({}) }}"
        status_code: "{{ item.status | default(200) }}"
        follow_redirects: none
        validate_certs: false
        timeout: 10
      loop: "{{ verify_http | default([]) }}"
      loop_control:
        label: "{{ item.url }}"
      register: verify_http_result
      failed_when: false
      check_mode: false

    - name: Connect to the TCP ports
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item }}"
        timeout: 5
      loop: "{{ verify_tcp | default([]) }}"
      register: verify_tcp_result
      failed_when: false
      check_mode: false

    - name: Check the network links
      ansible.builtin.command: ip -br link show {{ item }}
      loop: "{{ verify_interfaces | default([]) }}"
      register: verify_link
      changed_when: false
      failed_when: false
      check_mode: false

    - name: List containers
      ansible.builtin.command: docker ps -a --format json
      register: verify_containers
      changed_when: false
      check_mode: false
      when: "'docker' in group_names"

    - name: Read the DOCKER-USER chain
      ansible.builtin.command: iptables -S DOCKER-USER
      register: verify_docker_user
      changed_when: false
      failed_when: false
      check_mode: false
      when: "'docker' in group_names"

    - name: Read the FORWARD chain
      ansible.builtin.command: iptables -S FORWARD
      register: verify_forward
      changed_when: false
      failed_when: false
      check_mode: false
      when: "'docker' in group_names"

    # Each check appends to verify_problems; failed_when: false above keeps every check
    # running, so the judgement happens here.
    - name: Start the problem list
      ansible.builtin.set_fact:
        verify_problems: "{{ verify_failed.stdout_lines | map('split') | map('first')
                             | map('regex_replace', '^', 'failed unit: ') | list }}"

    - name: Note inactive units
      ansible.builtin.set_fact:
        verify_problems: "{{ verify_problems + ['unit ' ~ item.item ~ ': ' ~ item.stdout] }}"
      loop: "{{ verify_unit_state.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.rc != 0

    - name: Note full disks
      ansible.builtin.set_fact:
        verify_problems: "{{ verify_problems + ['disk ' ~ item.split()[1] ~ ': ' ~ item.split()[0]] }}"
      loop: "{{ verify_df.stdout_lines[1:] }}"
      when: (item.split()[0] | replace('%', '') | int) >= verify_disk_max_pct

    - name: Note a pending reboot
      ansible.builtin.set_fact:
        verify_problems: "{{ verify_problems + ['reboot pending since ' ~ verify_reboot_age_h ~ ' h'] }}"
      vars:
        verify_reboot_age_h: "{{ ((now().timestamp() - verify_reboot.stat.mtime) / 3600) | int }}"
      when:
        - verify_reboot.stat.exists
        - verify_reboot_age_h | int >= verify_reboot_max_age_h

    - name: Note a needrestart that didn't run
      ansible.builtin.set_fact:
        verify_problems: "{{ verify_problems + ['needrestart failed: ' ~ verify_reason] }}"
      vars:
        verify_reason: "{{ verify_needrestart.stderr | default('') or verify_needrestart.msg | default('rc ' ~ verify_needrestart.rc) }}"
      when: verify_needrestart.rc | default(-1) != 0

    # needrestart never restarts these itself (its override_rc, e.g. ^dbus and ^network,
    # and its deferred list); a reboot or a container restart picks them up.
    - name: Note services on replaced libraries
      ansible.builtin.set_fact:
        verify_problems: "{{ verify_problems + ['needs restart (old libraries): ' ~ verify_stale | join(', ')] }}"
      vars:
        verify_stale: "{{ verify_needrestart.stdout_lines | default([]) | select('match', 'NEEDRESTART-SVC: ')
                          | map('regex_replace', '^NEEDRESTART-SVC: ', '')
                          | reject('match', verify_needrestart_ignore) | list }}"
        verify_needrestart_ignore: "^({{ verify_needrestart_deferred | join('|') }})\\.service$"
        verify_needrestart_deferred:
          - dbus
          - dbus-broker
          - network.*
          - systemd-logind
          - unattended-upgrades
          - apt-daily
          - apt-daily-upgrade
          - user@[0-9]+
          - (container-|console-|serial-)?getty(@.*)?
      when:
        - verify_needrestart.rc | default(-1) == 0
        - verify_stale | length > 0

    - name: Note bad HTTP answers
      ansible.builtin.set_fact:
        verify_problems: "{{ verify_problems + [item.item.url ~ ': ' ~ (item.status if item.status > 0 else item.msg)] }}"
      loop: "{{ verify_http_result.results }}"
      loop_control:
        label: "{{ item.item.url }}"
      when: item.status != (item.item.status | default(200))

    - name: Note closed ports
      ansible.builtin.set_fact:
        verify_problems: "{{ verify_problems + ['port ' ~ item.item ~ ' closed'] }}"
      loop: "{{ verify_tcp_result.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.state is not defined

    - name: Note links that are down
      ansible.builtin.set_fact:
        verify_problems: "{{ verify_problems + ['link ' ~ item.item ~ ' down'] }}"
      loop: "{{ verify_link.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.rc != 0 or item.stdout is not search('[<,]UP[,>]')

    - name: Note stopped or unhealthy containers
      ansible.builtin.set_fact:
        verify_problems: "{{ verify_problems + ['container ' ~ item.Names ~ ': ' ~ item.Status] }}"
      loop: "{{ verify_containers.stdout_lines | default([]) | map('from_json') | list }}"
      loop_control:
        label: "{{ item.Names }}"
      when: >-
        (item.State != 'running' and item.Names not in verify_docker_exited_ok | default([]))
        or item.Status is search('unhealthy|health: starting')

    # Ports is e.g. "80/tcp, 0.0.0.0:2283->2283/tcp, [::]:3478->3478/udp, 0.0.0.0:8000-8001->8000-8001/tcp"
    # (only entries with -> are published). An entry the pattern doesn't fit is flagged too.
    # docker_user_filter covers IPv4 TCP; anything else must be in docker_published_open.
    - name: Note published ports nobody decided on
      ansible.builtin.set_fact:
        verify_problems: "{{ verify_problems + [('published binding not understood: ' ~ item.port) if item.proto == 'unparsed'
                             else ('published ' ~ item.proto ~ (' IPv6' if item.v6 else '') ~ ' port ' ~ item.port
                             ~ ' is in neither docker_user_filter nor docker_published_open')] }}"
      vars:
        verify_filtered: "{{ docker_user_filter | default([]) | map(attribute='port') | map('int') | list }}"
        verify_open: "{{ docker_published_open | default([]) | map('int') | list }}"
      loop: >-
        {%- set out = [] -%}
        {%- for c in verify_containers.stdout_lines | default([]) | map('from_json') -%}
        {%- for e in c.Ports.split(', ') | select('search', '->') -%}
        {%- set b = e | regex_findall('^([[][^]]*[]]|[0-9.]+):([0-9]+)(?:-([0-9]+))?->[0-9-]+/([a-z]+)$') -%}
        {%- if b | length == 1 -%}
        {%- set b = b[0] -%}
        {%- for p in range(b[1] | int, (b[2] or b[1]) | int + 1) -%}
        {%- set _ = out.append({'v6': b[0].startswith('['), 'port': p, 'proto': b[3]}) -%}
        {%- endfor -%}
        {%- else -%}
        {%- set _ = out.append({'v6': false, 'port': e, 'proto': 'unparsed'}) -%}
        {%- endif -%}
        {%- endfor -%}
        {%- endfor -%}
        {{ out | unique }}
      loop_control:
        label: "{{ item.proto }} {{ item.port }}"
      when:
        - "'docker' in group_names"
        - item.port not in verify_open
        - item.v6 or item.proto != 'tcp' or item.port not in verify_filtered

    # The chain must be exactly what docker-user-filter.rules loads, for the current address
    # (ansible_host is the production address after cutover), and FORWARD must enter it first.
    - name: Note a DOCKER-USER chain that isn't the filter
      ansible.builtin.set_fact:
        verify_problems: "{{ verify_problems + ['DOCKER-USER is not the docker_user_filter rules: ' ~ verify_docker_user.stdout_lines | join(' | ')] }}"
      vars:
        verify_expected: >-
          {%- set out = ['-N DOCKER-USER', '-A DOCKER-USER -m conntrack --ctstate RELATED,ESTABLISHED -j RETURN'] -%}
          {%- for rule in docker_user_filter | default([]) -%}
          {%- set m = '-p tcp -m conntrack --ctorigdst ' ~ ansible_host ~ ' --ctorigdstport ' ~ rule.port -%}
          {%- for src in ([rule.allow] if rule.allow is string else rule.allow) -%}
          {%- set _ = out.append('-A DOCKER-USER -s ' ~ src ~ '/32 ' ~ m ~ ' -j RETURN') -%}
          {%- endfor -%}
          {%- set _ = out.append('-A DOCKER-USER ' ~ m ~ ' -j DROP') -%}
          {%- endfor -%}
          {%- set _ = out.append('-A DOCKER-USER -j RETURN') -%}
          {{ out }}
      when:
        - "'docker' in group_names"
        - docker_user_filter | default([]) | length > 0
        - verify_docker_user.stdout_lines != verify_expected

    - name: Note a FORWARD chain that skips DOCKER-USER
      ansible.builtin.set_fact:
        verify_problems: "{{ verify_problems + ['FORWARD does not start with -j DOCKER-USER'] }}"
      when:
        - "'docker' in group_names"
        - docker_user_filter | default([]) | length > 0
        - (verify_forward.stdout_lines | select('match', '-A ') | first | default('')) != '-A FORWARD -j DOCKER-USER'

    - name: Report
      ansible.builtin.assert:
        that: verify_problems | length == 0
        fail_msg: "{{ verify_problems }}"
        success_msg: healthy
        quiet: true
