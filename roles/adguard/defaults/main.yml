---
# The download is checked against the release's checksums.txt, so a bump needs no hash edit.
# renovate: datasource=github-releases depName=AdguardTeam/AdGuardHome
adguard_version: "v1.0.0"
adguard_dir: /opt/AdGuardHome
adguard_dist: /opt/AdGuardHome-dist
# AdGuardHome.yaml (settings, users, filters) and data/ (stats, sessions; the filter
# lists are downloaded again). The web UI writes the yaml, so it isn't templated.
adguard_data: /var/lib/adguardhome
adguard_marker: "{{ adguard_data }}/.migrated"
# Where the old community-scripts guest keeps it all.
adguard_legacy_dir: /opt/AdGuardHome
