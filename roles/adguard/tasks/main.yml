---
- name: Create the adguardhome user
  ansible.builtin.user:
    name: adguardhome
    system: true
    shell: /usr/sbin/nologin
    home: "{{ adguard_data }}"
    create_home: false

- name: Create the data directory
  ansible.builtin.file:
    path: "{{ adguard_data }}"
    state: directory
    owner: adguardhome
    group: adguardhome
    mode: "0700"

- name: Create the app and download directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ adguard_dir }}"
    - "{{ adguard_dist }}"
  register: adguard_dirs

- name: Download AdGuard Home {{ adguard_version }}
  ansible.builtin.get_url:
    url: https://github.com/AdguardTeam/AdGuardHome/releases/download/{{ adguard_version }}/AdGuardHome_linux_amd64.tar.gz
    dest: "{{ adguard_dist }}/AdGuardHome_{{ adguard_version }}_linux_amd64.tar.gz"
    checksum: "sha256:{{ adguard_sha256 }}"
    mode: "0644"
  # Under --check on a fresh guest the directory isn't there to download into.
  when: not ansible_check_mode or adguard_dirs is not changed

- name: Find old downloads
  ansible.builtin.find:
    paths: "{{ adguard_dist }}"
    patterns: "*.tar.gz"
    excludes: AdGuardHome_{{ adguard_version }}_linux_amd64.tar.gz
  register: adguard_old_dist
  when: not ansible_check_mode or adguard_dirs is not changed

- name: Remove old downloads
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ adguard_old_dist.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"

# The marker holds the installed version and is written last, so a Renovate bump, a
# revert or a failed step unpacks again on the next run.
- name: Read the installed version
  ansible.builtin.slurp:
    src: "{{ adguard_dir }}/.version"
  register: adguard_version_marker
  failed_when: false

- name: Decide whether to install
  ansible.builtin.set_fact:
    adguard_install: "{{ (adguard_version_marker.content | default('') | b64decode | trim) != adguard_version }}"

- name: Check for the service unit
  ansible.builtin.stat:
    path: /etc/systemd/system/adguardhome.service
  register: adguard_unit

- name: Stop AdGuard Home for the upgrade
  ansible.builtin.systemd_service:
    name: adguardhome
    state: stopped
  when:
    - adguard_install
    - adguard_unit.stat.exists

- name: Clear the version marker
  ansible.builtin.file:
    path: "{{ adguard_dir }}/.version"
    state: absent
  when: adguard_install

- name: Unpack AdGuard Home {{ adguard_version }}
  ansible.builtin.unarchive:
    src: "{{ adguard_dist }}/AdGuardHome_{{ adguard_version }}_linux_amd64.tar.gz"
    dest: "{{ adguard_dir }}"
    remote_src: true
    extra_opts: [--strip-components=2]
    owner: root
    group: root
  when:
    - adguard_install
    - not ansible_check_mode
  notify: Restart adguardhome

- name: Write the version marker
  ansible.builtin.copy:
    content: "{{ adguard_version }}\n"
    dest: "{{ adguard_dir }}/.version"
    mode: "0644"
  when: adguard_install

- name: Write the service unit
  ansible.builtin.template:
    src: adguardhome.service.j2
    dest: /etc/systemd/system/adguardhome.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart adguardhome

- name: Check for the migrated data
  ansible.builtin.stat:
    path: "{{ adguard_marker }}"
  register: adguard_migrated

# Without the copied config it would start the setup wizard on port 3000.
- name: Run AdGuard Home once its config is here
  ansible.builtin.systemd_service:
    name: adguardhome
    state: "{{ 'started' if adguard_migrated.stat.exists else 'stopped' }}"
    enabled: "{{ adguard_migrated.stat.exists }}"
    daemon_reload: true
  register: adguard_service
  when: not ansible_check_mode or adguard_unit.stat.exists
