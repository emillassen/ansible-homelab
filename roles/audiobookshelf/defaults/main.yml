---
# The data is copied, so this can't be older than the version that last wrote it.
# renovate: datasource=docker depName=ghcr.io/advplyr/audiobookshelf
audiobookshelf_version: "2.38.0"
audiobookshelf_project: /home/emil/audiobookshelf
# Audiobookshelf stays stopped until `run migrate` has copied config/ and metadata/.
audiobookshelf_marker: "{{ audiobookshelf_project }}/config/.migrated"
# The books share on Holocron. Its NFS rule matches the production address only.
audiobookshelf_nfs:
  - {src: "192.168.1.30:/mnt/user/books/Audiobooks", path: /mnt/audiobooks}
  - {src: "192.168.1.30:/mnt/user/books/Podcasts", path: /mnt/podcasts}
