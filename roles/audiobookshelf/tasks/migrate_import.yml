---
# metadata/ first: config/.migrated is the marker that lets Audiobookshelf start.
# Doesn't start it: the NFS shares only mount on the production address.
- name: Import {{ audiobookshelf_dir }}/
  ansible.builtin.include_role:
    name: data_copy
    tasks_from: dir_import
  vars:
    data_copy_name: audiobookshelf-{{ audiobookshelf_dir }}
    data_copy_path: "{{ audiobookshelf_project }}/{{ audiobookshelf_dir }}"
    data_copy_clean: true
  loop: [metadata, config]
  loop_control:
    loop_var: audiobookshelf_dir
