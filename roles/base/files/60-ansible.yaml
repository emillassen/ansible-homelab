# Managed by Ansible. Matches the NIC by name, not MAC, so a MAC change keeps the
# network up. "e*" covers cloud-init's eth0 and ens18 after the first reboot.
# The DHCP client ID is the MAC, as with cloud-init's netplan, so the lease and
# the UniFi reservation follow the MAC.
network:
  version: 2
  ethernets:
    lan:
      match:
        name: "e*"
      dhcp4: true
      dhcp6: true
      dhcp-identifier: mac
