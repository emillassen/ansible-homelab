---
# A fresh image is behind. Upgrade once, reboot onto it, then leave apt to
# unattended-upgrades. The marker keeps later runs at changed=0.
- name: Check for the first-upgrade marker
  ansible.builtin.stat:
    path: /var/lib/ansible-first-upgrade
  register: base_first_upgrade

- name: Upgrade everything once
  ansible.builtin.apt:
    upgrade: dist
    update_cache: true
  register: base_upgrade
  when: not base_first_upgrade.stat.exists

# One reboot covers the upgrade and, on VMs, the new netplan.
- name: Reboot onto the upgrade and the new network config
  ansible.builtin.reboot:
    reboot_timeout: 600
  when: >-
    not ansible_check_mode and
    (base_upgrade is changed or base_netplan is changed or base_netplan_old is changed)

- name: Write the first-upgrade marker
  ansible.builtin.copy:
    content: ""
    dest: /var/lib/ansible-first-upgrade
    force: false
    mode: "0644"
