---
- name: Write the sshd drop-in
  ansible.builtin.template:
    src: 00-ansible.conf.j2
    dest: /etc/ssh/sshd_config.d/00-ansible.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

# The work laptop's key, on VMs only and only through WireGuard (its traffic
# arrives masqueraded as the WireGuard guest). README.md, "Temporary laptop key".
- name: Note the work laptop key for this guest
  ansible.builtin.set_fact:
    base_work_keys: "{{ ['from=\"' ~ wireguard_lan_ip ~ '\" ' ~ emil_ssh_key_work] if ('vm' in group_names and emil_ssh_key_work | default('') != '') else [] }}"

- name: Allow exactly your key and the controller's for the login user
  ansible.posix.authorized_key:
    user: "{{ ansible_user }}"
    key: "{{ ([emil_ssh_key, emil_ssh_key_temp, controller_ssh_key] + base_work_keys) | join('\n') }}"
    exclusive: true
    state: present
  when: controller_ssh_key_previous == ""

# Only while rotating the controller key: README.md, "Controller key".
- name: Allow your key and both controller keys for the login user
  ansible.posix.authorized_key:
    user: "{{ ansible_user }}"
    key: "{{ ([emil_ssh_key, emil_ssh_key_temp, controller_ssh_key, controller_ssh_key_previous] + base_work_keys) | join('\n') }}"
    exclusive: true
    state: present
  when: controller_ssh_key_previous != ""

- name: Remove root's keys on VMs
  ansible.builtin.file:
    path: /root/.ssh/authorized_keys
    state: absent
  when: ansible_user != 'root'
