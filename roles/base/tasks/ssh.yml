---
- name: Write the sshd drop-in
  ansible.builtin.template:
    src: 00-ansible.conf.j2
    dest: /etc/ssh/sshd_config.d/00-ansible.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Allow exactly your key and the controller's for the login user
  ansible.posix.authorized_key:
    user: "{{ ansible_user }}"
    key: "{{ emil_ssh_key }}\n{{ emil_ssh_key_temp }}\n{{ controller_ssh_key }}"
    exclusive: true
    state: present
  when: controller_ssh_key_previous == ""

# Only while rotating the controller key: README.md, "Controller key".
- name: Allow your key and both controller keys for the login user
  ansible.posix.authorized_key:
    user: "{{ ansible_user }}"
    key: "{{ emil_ssh_key }}\n{{ emil_ssh_key_temp }}\n{{ controller_ssh_key }}\n{{ controller_ssh_key_previous }}"
    exclusive: true
    state: present
  when: controller_ssh_key_previous != ""

- name: Remove root's keys on VMs
  ansible.builtin.file:
    path: /root/.ssh/authorized_keys
    state: absent
  when: ansible_user != 'root'
