---
- name: Link /etc/localtime
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ timezone }}"
    dest: /etc/localtime
    state: link
    force: true

- name: Write /etc/timezone
  ansible.builtin.copy:
    content: "{{ timezone }}\n"
    dest: /etc/timezone
    mode: "0644"

- name: Generate locales
  community.general.locale_gen:
    name:
      - "{{ locale_lang }}"
      - "{{ locale_lc }}"
    state: present
  when: not ansible_check_mode or 'locales' in ansible_facts.packages

# Debian 13 and Ubuntu 26.04 keep the locale in /etc/locale.conf, and the locales
# package makes /etc/default/locale a link to it. Write the file, keep the link.
- name: Write /etc/locale.conf
  ansible.builtin.template:
    src: locale.j2
    dest: /etc/locale.conf
    mode: "0644"

- name: Link /etc/default/locale to it
  ansible.builtin.file:
    src: ../locale.conf
    dest: /etc/default/locale
    state: link
    force: true
