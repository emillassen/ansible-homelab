---
# The marker this writes is what lets the main role start Caddy.
- name: Import the certificates and ACME accounts
  ansible.builtin.include_role:
    name: data_copy
    tasks_from: dir_import
  vars:
    data_copy_name: caddy
    data_copy_path: "{{ caddy_data }}"
    data_copy_owner: caddy
    data_copy_group: caddy
    data_copy_clean: true
    data_copy_service: caddy
