---
- name: Install controller packages
  ansible.builtin.apt:
    name:
      - curl
      - git
      - python3-venv
      - rsync
      - util-linux
    state: present

- name: Create the ansible user
  ansible.builtin.user:
    name: ansible
    system: true
    home: /home/ansible
    shell: /bin/bash
    password: "!"

- name: Create the ansible user's directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: ansible
    group: ansible
    mode: "0700"
  loop:
    - /home/ansible/.ssh
    - /home/ansible/log

# sync copies /home/ansible/src's mode (0750, from bootstrap's umask) onto /opt/ansible.
- name: Create /opt/ansible
  ansible.builtin.file:
    path: /opt/ansible
    state: directory
    owner: ansible
    group: ansible
    mode: "0750"

- name: Install the controller SSH key
  ansible.builtin.copy:
    src: id_ed25519.vault
    dest: /home/ansible/.ssh/id_ed25519
    owner: ansible
    group: ansible
    mode: "0600"
  diff: false
  no_log: true

- name: Install the controller SSH public key
  ansible.builtin.copy:
    src: id_ed25519.pub
    dest: /home/ansible/.ssh/id_ed25519.pub
    owner: ansible
    group: ansible
    mode: "0644"

- name: Allow you and any 207 agents, each through the forced command
  ansible.posix.authorized_key:
    user: ansible
    key: "{{ lookup('ansible.builtin.template', 'authorized_keys.j2') }}"
    exclusive: true
    state: present

- name: Install the controller host key
  ansible.builtin.copy:
    src: ssh_host_ed25519_key.vault
    dest: /etc/ssh/ssh_host_ed25519_key
    owner: root
    group: root
    mode: "0600"
  diff: false
  no_log: true
  notify: Restart ssh

- name: Install the controller host public key
  ansible.builtin.copy:
    src: ssh_host_ed25519_key.pub
    dest: /etc/ssh/ssh_host_ed25519_key.pub
    owner: root
    group: root
    mode: "0644"
  notify: Restart ssh

- name: Serve only the ed25519 host key
  ansible.builtin.copy:
    src: 01-controller.conf
    dest: /etc/ssh/sshd_config.d/01-controller.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Install sync, run and agent-shell
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/{{ item.src }}"
    dest: "/usr/local/sbin/{{ item.dest }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - src: sync
      dest: ansible-sync
    - src: run
      dest: ansible-run
    - src: agent-shell
      dest: agent-shell
    - src: verify-push
      dest: ansible-verify-push
    - src: nightly
      dest: ansible-nightly

- name: Nightly verify to Uptime Kuma
  when: controller_verify_push_token != ""
  block:
    # Root-only; systemd reads it before dropping to ansible.
    - name: Write the push URL
      ansible.builtin.copy:
        content: "KUMA_PUSH_URL={{ controller_verify_push_url }}\n"
        dest: /etc/ansible-verify.env
        owner: root
        group: root
        mode: "0600"
      diff: false
      no_log: true

    - name: Install the verify service and timer
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
      loop:
        - ansible-verify.service
        - ansible-verify.timer
      register: controller_verify_units

    - name: Start the verify timer
      ansible.builtin.systemd_service:
        name: ansible-verify.timer
        enabled: true
        state: started
        daemon_reload: "{{ controller_verify_units is changed }}"
      # Check mode doesn't write the units, so on a first install there is no timer yet.
      when: not (ansible_check_mode and controller_verify_units is changed)

- name: Remove the nightly verify without a token
  when: controller_verify_push_token == ""
  block:
    - name: Look for the verify timer
      ansible.builtin.stat:
        path: /etc/systemd/system/ansible-verify.timer
      register: controller_verify_timer

    - name: Stop the verify timer
      ansible.builtin.systemd_service:
        name: ansible-verify.timer
        enabled: false
        state: stopped
      when: controller_verify_timer.stat.exists

    - name: Remove the verify units and push URL
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/ansible-verify.service
        - /etc/systemd/system/ansible-verify.timer
        - /etc/ansible-verify.env
      register: controller_verify_removed

    - name: Reload systemd after removing the verify units
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: controller_verify_removed is changed

# The Proxmox token and the push URLs; readable by ansible like the vault password.
- name: Write the nightly deploy settings
  ansible.builtin.template:
    src: nightly.json.j2
    dest: /home/ansible/.nightly.json
    owner: ansible
    group: ansible
    mode: "0600"
  diff: false
  no_log: true

- name: Install the nightly deploy units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - ansible-nightly.service
    - ansible-nightly.timer
    - ansible-nightly-ran.service
    - ansible-nightly-ran.timer
  register: controller_nightly_units

# Off until both Kuma push tokens are in the vault.
- name: Start or stop the nightly deploy timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: "{{ controller_nightly_enabled | bool }}"
    state: "{{ 'started' if controller_nightly_enabled | bool else 'stopped' }}"
    daemon_reload: "{{ controller_nightly_units is changed }}"
  loop:
    - ansible-nightly.timer
    - ansible-nightly-ran.timer
  # Check mode doesn't write the units, so on a first install there are no timers yet.
  when: not (ansible_check_mode and controller_nightly_units is changed)

- name: Rotate the Ansible log
  ansible.builtin.copy:
    src: logrotate-ansible
    dest: /etc/logrotate.d/ansible
    mode: "0644"

- name: Read the vault password file
  ansible.builtin.stat:
    path: /home/ansible/.vault-pass
  register: controller_vault_pass

- name: Check the vault password file
  ansible.builtin.assert:
    that:
      - controller_vault_pass.stat.exists
      - controller_vault_pass.stat.mode == '0600'
      - controller_vault_pass.stat.pw_name == 'ansible'
    fail_msg: /home/ansible/.vault-pass is missing or not 0600 ansible. Re-run bootstrap-controller.sh --reset-vault-pass.
