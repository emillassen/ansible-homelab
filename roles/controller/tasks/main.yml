---
- name: Install controller packages
  ansible.builtin.apt:
    name:
      - curl
      - git
      - python3-venv
      - rsync
      - util-linux
    state: present

- name: Create the ansible user
  ansible.builtin.user:
    name: ansible
    system: true
    home: /home/ansible
    shell: /bin/bash
    password: "!"

- name: Create the ansible user's directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: ansible
    group: ansible
    mode: "0700"
  loop:
    - /home/ansible/.ssh
    - /home/ansible/log

# sync copies /home/ansible/src's mode (0750, from bootstrap's umask) onto /opt/ansible.
- name: Create /opt/ansible
  ansible.builtin.file:
    path: /opt/ansible
    state: directory
    owner: ansible
    group: ansible
    mode: "0750"

- name: Install the controller SSH key
  ansible.builtin.copy:
    src: id_ed25519.vault
    dest: /home/ansible/.ssh/id_ed25519
    owner: ansible
    group: ansible
    mode: "0600"
  diff: false
  no_log: true

- name: Install the controller SSH public key
  ansible.builtin.copy:
    src: id_ed25519.pub
    dest: /home/ansible/.ssh/id_ed25519.pub
    owner: ansible
    group: ansible
    mode: "0644"

- name: Allow you through the forced command
  ansible.posix.authorized_key:
    user: ansible
    key: restrict,command="/usr/local/sbin/agent-shell human" {{ emil_ssh_key }}
    exclusive: true
    state: present
  when: hermes_ssh_key == ""

- name: Allow you and the 207 agents, each through the forced command
  ansible.posix.authorized_key:
    user: ansible
    key: |-
      restrict,command="/usr/local/sbin/agent-shell human" {{ emil_ssh_key }}
      restrict,from="192.168.1.225",command="/usr/local/sbin/agent-shell agent" {{ hermes_ssh_key }}
    exclusive: true
    state: present
  when: hermes_ssh_key != ""

- name: Install the controller host key
  ansible.builtin.copy:
    src: ssh_host_ed25519_key.vault
    dest: /etc/ssh/ssh_host_ed25519_key
    owner: root
    group: root
    mode: "0600"
  diff: false
  no_log: true
  notify: Restart ssh

- name: Install the controller host public key
  ansible.builtin.copy:
    src: ssh_host_ed25519_key.pub
    dest: /etc/ssh/ssh_host_ed25519_key.pub
    owner: root
    group: root
    mode: "0644"
  notify: Restart ssh

- name: Serve only the ed25519 host key
  ansible.builtin.copy:
    src: 01-controller.conf
    dest: /etc/ssh/sshd_config.d/01-controller.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Install sync, run and agent-shell
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/{{ item.src }}"
    dest: "/usr/local/sbin/{{ item.dest }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - src: sync
      dest: ansible-sync
    - src: run
      dest: ansible-run
    - src: agent-shell
      dest: agent-shell

- name: Rotate the Ansible log
  ansible.builtin.copy:
    src: logrotate-ansible
    dest: /etc/logrotate.d/ansible
    mode: "0644"

- name: Read the vault password file
  ansible.builtin.stat:
    path: /home/ansible/.vault-pass
  register: controller_vault_pass

- name: Check the vault password file
  ansible.builtin.assert:
    that:
      - controller_vault_pass.stat.exists
      - controller_vault_pass.stat.mode == '0600'
      - controller_vault_pass.stat.pw_name == 'ansible'
    fail_msg: /home/ansible/.vault-pass is missing or not 0600 ansible. Re-run bootstrap-controller.sh --reset-vault-pass.
