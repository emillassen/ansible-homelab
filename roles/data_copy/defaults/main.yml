---
# Set by the calling role: a short name for the staging file and the directory to copy.
data_copy_name: ""
data_copy_path: ""
# Optional. Paths relative to data_copy_path left out of the archive (build caches).
data_copy_exclude: []
# Optional. Paths relative to data_copy_path to pack, in place of the whole directory.
data_copy_include: [.]
# Owner of everything unpacked on the new guest.
data_copy_owner: root
data_copy_group: root
# true: keep each file's numeric owner, group and mode from the old guest instead
# (directories with mixed owners, like Docker volumes). data_copy_owner then only
# applies to data_copy_path itself.
data_copy_keep_owners: false
# Optional. Empty the directory before unpacking (a package already filled it).
data_copy_clean: false
data_copy_staging: /home/ansible/transfer
# On the old guest. The directory is the login user's and 0700, so the archive is
# private and can be fetched without become.
data_copy_archive_dir: /var/tmp/ansible-migrate
data_copy_archive: "{{ data_copy_archive_dir }}/{{ data_copy_name }}.tar.gz"
# Optional. Stopped after the marker check and started again after the import.
data_copy_service: ""
