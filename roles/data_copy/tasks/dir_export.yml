---
# On the old guest, with the app already stopped. Packs a directory and pulls it to the controller.
- name: Read {{ data_copy_path }}
  ansible.builtin.stat:
    path: "{{ data_copy_path }}"
  register: data_copy_source

- name: Check that {{ data_copy_path }} exists
  ansible.builtin.assert:
    that: data_copy_source.stat.isdir | default(false)
    fail_msg: "{{ data_copy_path }} is missing on {{ inventory_hostname }}"

- name: Pack {{ data_copy_path }}
  ansible.builtin.command:
    cmd: tar -C {{ data_copy_path }} -czf /root/migrate-{{ data_copy_name }}.tar.gz .
  changed_when: true

- name: Create the staging directory on the controller
  ansible.builtin.file:
    path: "{{ data_copy_staging }}"
    state: directory
    mode: "0700"
  delegate_to: localhost

- name: Fetch the archive
  ansible.builtin.fetch:
    src: /root/migrate-{{ data_copy_name }}.tar.gz
    dest: "{{ data_copy_staging }}/{{ data_copy_name }}.tar.gz"
    flat: true

- name: Delete the archive on the old guest
  ansible.builtin.file:
    path: /root/migrate-{{ data_copy_name }}.tar.gz
    state: absent
