---
# On the old guest, with the app already stopped. Packs a directory and pulls it to the controller.
- name: Read {{ data_copy_path }}
  ansible.builtin.stat:
    path: "{{ data_copy_path }}"
  register: data_copy_source

- name: Check that {{ data_copy_path }} exists
  ansible.builtin.assert:
    that: data_copy_source.stat.isdir | default(false)
    fail_msg: "{{ data_copy_path }} is missing on {{ inventory_hostname }}"

- name: Create the private archive directory
  ansible.builtin.file:
    path: "{{ data_copy_archive_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: "0700"

- name: Pack {{ data_copy_path }}
  ansible.builtin.command:
    cmd: >-
      tar -C {{ data_copy_path }}
      {% for e in data_copy_exclude %}--exclude=./{{ e | quote }} {% endfor %}
      -czf {{ data_copy_archive }}
      {% for i in data_copy_include %}{{ ('./' ~ i) | regex_replace('^\\./\\.$', '.') | quote }} {% endfor %}
  changed_when: true

- name: Create the staging directory on the controller
  ansible.builtin.file:
    path: "{{ data_copy_staging }}"
    state: directory
    mode: "0700"
  delegate_to: localhost

# fetch under become reads the whole file into memory (slurp), which the controller
# can't hold. Owned by the login user, it is fetched without become and streams.
- name: Hand the archive to {{ ansible_user }}
  ansible.builtin.file:
    path: "{{ data_copy_archive }}"
    owner: "{{ ansible_user }}"
    mode: "0600"
  when: not ansible_check_mode

- name: Fetch the archive
  ansible.builtin.fetch:
    src: "{{ data_copy_archive }}"
    dest: "{{ data_copy_staging }}/{{ data_copy_name }}.tar.gz"
    flat: true
  become: false

- name: Delete the archive on the old guest
  ansible.builtin.file:
    path: "{{ data_copy_archive }}"
    state: absent
