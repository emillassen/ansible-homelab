---
# On the new guest, with the app stopped. Unpacks into the directory and marks it imported.
- name: Check for an earlier import
  ansible.builtin.stat:
    path: "{{ data_copy_path }}/.migrated"
  register: data_copy_marker

- name: Refuse a second import
  ansible.builtin.assert:
    that: not data_copy_marker.stat.exists
    fail_msg: "Already imported. Delete {{ data_copy_path }}/.migrated on {{ inventory_hostname }} to import again."

- name: Stop {{ data_copy_service }} before replacing its data
  ansible.builtin.service:
    name: "{{ data_copy_service }}"
    state: stopped
  when: data_copy_service != ""

# After the marker check, so a finished import is never emptied.
- name: Find what's already in {{ data_copy_path }}
  ansible.builtin.find:
    paths: "{{ data_copy_path }}"
    file_type: any
    hidden: true
  register: data_copy_existing
  when: data_copy_clean

- name: Empty {{ data_copy_path }}
  ansible.builtin.file:
    path: "{{ data_copy_entry.path }}"
    state: absent
  loop: "{{ data_copy_existing.files | default([]) }}"
  loop_control:
    loop_var: data_copy_entry
    label: "{{ data_copy_entry.path }}"
  when: data_copy_clean

- name: Create {{ data_copy_path }}
  ansible.builtin.file:
    path: "{{ data_copy_path }}"
    state: directory
    owner: "{{ data_copy_owner }}"
    group: "{{ data_copy_group }}"
    mode: "0750"

# The fetch doesn't run under --check, so there is nothing staged to unpack.
- name: Unpack the archive
  ansible.builtin.unarchive:
    src: "{{ data_copy_staging }}/{{ data_copy_name }}.tar.gz"
    dest: "{{ data_copy_path }}"
    owner: "{{ omit if data_copy_keep_owners else data_copy_owner }}"
    group: "{{ omit if data_copy_keep_owners else data_copy_group }}"
    # As root, tar restores the archived owners and modes; numeric, so a uid that
    # has another name here (postgres in a container) stays the same uid.
    extra_opts: "{{ ['--numeric-owner'] if data_copy_keep_owners else [] }}"
  when: not ansible_check_mode

# tar creates parent directories it has no entry for (data_copy_include: [data/x])
# as root, and unarchive only sets the owner on the entries.
- name: Give everything in {{ data_copy_path }} to {{ data_copy_owner }}
  ansible.builtin.file:
    path: "{{ data_copy_path }}"
    state: directory
    recurse: true
    owner: "{{ data_copy_owner }}"
    group: "{{ data_copy_group }}"
  when:
    - not ansible_check_mode
    - not data_copy_keep_owners

- name: Mark the import done
  ansible.builtin.copy:
    content: ""
    dest: "{{ data_copy_path }}/.migrated"
    force: false
    mode: "0644"

- name: Start {{ data_copy_service }}
  ansible.builtin.service:
    name: "{{ data_copy_service }}"
    state: started
  when: data_copy_service != ""

- name: Delete the staging copy
  ansible.builtin.file:
    path: "{{ data_copy_staging }}/{{ data_copy_name }}.tar.gz"
    state: absent
  delegate_to: localhost
