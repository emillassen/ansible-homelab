---
# On the old VM. Stopping Linkding starts its outage. db.sqlite3 and tasks.sqlite3
# are SQLite with a WAL, so data/ is copied with Linkding stopped.
- name: Stop Linkding on the old VM
  ansible.builtin.command:
    cmd: docker compose stop
    chdir: "{{ linkding_project }}"
  changed_when: true

- name: Export data/
  ansible.builtin.include_role:
    name: data_copy
    tasks_from: dir_export
  vars:
    data_copy_name: linkding
    data_copy_path: "{{ linkding_project }}/data"
