---
# On the old VM. Stored device keys and passwords are sealed with the session secret,
# so the new VM needs the same one, which it gets from the vault. The old VM has it in
# the compose file; a rebuilt one in .env. Checked before stopping anything, so a
# vault that doesn't match costs no outage.
- name: Read the session secret
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      { cat docker-compose.yml; if [ -f .env ]; then cat .env; fi; }
      | sed -nE 's/^[[:space:]-]*SESSION_SECRET=["]?([^"[:space:]]+)["]?[[:space:]]*$/\1/p'
      | head -n 1
    chdir: "{{ meshmonitor_project }}"
    executable: /bin/bash
  register: meshmonitor_secret_read
  changed_when: false
  check_mode: false
  no_log: true

- name: Check that the vault holds the old VM's session secret
  ansible.builtin.assert:
    that: meshmonitor_secret_read.stdout == meshmonitor_session_secret
    fail_msg: >-
      SESSION_SECRET in {{ meshmonitor_project }} on {{ inventory_hostname }} is missing or
      differs from vault_meshmonitor_session_secret. Put the old one in the vault first.
  no_log: true

# Stopping MeshMonitor starts its outage. meshmonitor.db is SQLite (with a WAL),
# so it's copied with MeshMonitor stopped.
- name: Stop MeshMonitor on the old VM
  ansible.builtin.command:
    cmd: docker compose stop
    chdir: "{{ meshmonitor_project }}"
  changed_when: true

- name: Export data/
  ansible.builtin.include_role:
    name: data_copy
    tasks_from: dir_export
  vars:
    data_copy_name: meshmonitor
    data_copy_path: "{{ meshmonitor_export_data }}"
