---
- name: Check for an earlier restore
  ansible.builtin.stat:
    path: "{{ miniflux_marker }}"
  register: miniflux_restored

- name: Refuse to restore over a running Miniflux
  ansible.builtin.assert:
    that: not miniflux_restored.stat.exists
    fail_msg: "Already restored. Delete {{ miniflux_marker }} on {{ inventory_hostname }} to restore again."

# The dump is only passing through, guarded by the marker above, so a dump left by a
# failed restore is dropped and the restore can simply be run again.
- name: Delete a dump left by a failed restore
  ansible.builtin.file:
    path: "{{ miniflux_restore_dir }}"
    state: absent

- name: Import the dump
  ansible.builtin.include_role:
    name: data_copy
    tasks_from: dir_import
  vars:
    data_copy_name: miniflux
    data_copy_path: "{{ miniflux_restore_dir }}"

- name: Restore the database
  when: not ansible_check_mode
  block:
    # Only running after a deliberate re-restore (marker deleted by hand).
    - name: Stop Miniflux before the restore
      community.docker.docker_compose_v2:
        project_src: "{{ miniflux_project }}"
        services: [miniflux]
        state: stopped

    - name: Start Postgres
      community.docker.docker_compose_v2:
        project_src: "{{ miniflux_project }}"
        services: [db]
        pull: missing
        state: present
        wait: true

    # --clean --if-exists makes a retry after a half-done restore start over.
    - name: Restore the dump into the new database
      ansible.builtin.shell:
        cmd: >-
          docker compose exec -T db pg_restore -U miniflux -d miniflux
          --clean --if-exists --no-owner --exit-on-error
          < {{ miniflux_restore_dir }}/miniflux.dump
        chdir: "{{ miniflux_project }}"
      changed_when: true

    - name: Mark the restore done
      ansible.builtin.copy:
        content: ""
        dest: "{{ miniflux_marker }}"
        mode: "0644"

    - name: Delete the dump
      ansible.builtin.file:
        path: "{{ miniflux_restore_dir }}"
        state: absent

    - name: Start Miniflux
      community.docker.docker_compose_v2:
        project_src: "{{ miniflux_project }}"
        pull: missing
        state: present
