---
# From the mosquitto.org apt repo, updated by unattended-upgrades, so nothing is pinned here.
mosquitto_listen_port: 1883
mosquitto_passwd: /etc/mosquitto/passwd
# The password file's lines (user:hash, made with mosquitto_passwd), from the vault.
mosquitto_passwd_content: "{{ vault_mosquitto_passwd }}"
mosquitto_db: /var/lib/mosquitto/mosquitto.db
mosquitto_staging: /home/ansible/transfer/mosquitto
