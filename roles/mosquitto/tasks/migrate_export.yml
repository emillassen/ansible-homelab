---
# On the old guest. Stopping the broker writes mosquitto.db and starts the outage.
# Under --check nothing is stopped or fetched; the stat shows what would be copied.
# The password file isn't copied: the new guest writes it from the vault.
- name: Read the database to copy
  ansible.builtin.stat:
    path: "{{ mosquitto_db }}"
  register: mosquitto_export_db

- name: Check that the database exists
  ansible.builtin.assert:
    that: mosquitto_export_db.stat.exists
    fail_msg: "{{ mosquitto_db }} is missing on {{ inventory_hostname }}"

- name: Stop Mosquitto on the old guest
  ansible.builtin.service:
    name: mosquitto
    state: stopped

- name: Create the staging directory on the controller
  ansible.builtin.file:
    path: "{{ mosquitto_staging }}"
    state: directory
    mode: "0700"
  delegate_to: localhost

- name: Fetch the database
  ansible.builtin.fetch:
    src: "{{ mosquitto_db }}"
    dest: "{{ mosquitto_staging }}/"
    flat: true
