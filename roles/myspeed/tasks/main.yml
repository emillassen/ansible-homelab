---
- name: Install Node.js
  ansible.builtin.apt:
    name:
      - nodejs
      - npm
      - unzip
    state: present

- name: Create the myspeed user
  ansible.builtin.user:
    name: myspeed
    system: true
    shell: /usr/sbin/nologin
    home: "{{ myspeed_data }}"
    create_home: false

- name: Create the app directory
  ansible.builtin.file:
    path: "{{ myspeed_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# The marker names the version and is written last, so a Renovate bump or a failed
# `npm ci` unpacks and installs again on the next run.
- name: Check for MySpeed {{ myspeed_version }}
  ansible.builtin.stat:
    path: "{{ myspeed_dir }}/.version-{{ myspeed_version }}"
  register: myspeed_marker

- name: Unpack MySpeed {{ myspeed_version }}
  ansible.builtin.unarchive:
    src: https://github.com/gnmyt/myspeed/releases/download/v{{ myspeed_version }}/MySpeed-{{ myspeed_version }}.zip
    dest: "{{ myspeed_dir }}"
    remote_src: true
    owner: root
    group: root
  when:
    - not myspeed_marker.stat.exists
    - not ansible_check_mode or 'unzip' in ansible_facts.packages

- name: Install the dependencies
  ansible.builtin.command:
    cmd: npm ci --omit=dev
    chdir: "{{ myspeed_dir }}"
  # Under --check the directory may not exist yet, and command would be skipped anyway.
  when:
    - not myspeed_marker.stat.exists
    - not ansible_check_mode
  notify: Restart myspeed

- name: Write the version marker
  ansible.builtin.copy:
    content: ""
    dest: "{{ myspeed_dir }}/.version-{{ myspeed_version }}"
    mode: "0644"
  when: not myspeed_marker.stat.exists

# MySpeed downloads its speed-test binaries here at runtime.
- name: Create the binaries directory
  ansible.builtin.file:
    path: "{{ myspeed_dir }}/bin"
    state: directory
    owner: myspeed
    group: myspeed
    mode: "0755"

- name: Create the data directory
  ansible.builtin.file:
    path: "{{ myspeed_data }}"
    state: directory
    owner: myspeed
    group: myspeed
    mode: "0750"

- name: Write the service unit
  ansible.builtin.template:
    src: myspeed.service.j2
    dest: /etc/systemd/system/myspeed.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart myspeed

- name: Start MySpeed
  ansible.builtin.systemd_service:
    name: myspeed
    state: started
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode or 'nodejs' in ansible_facts.packages
