---
- name: Wait for the container's address
  community.proxmox.proxmox_vm_info:
    vmid: "{{ vmid }}"
    config: current
    network: true
  register: proxmox_guest_net
  until: >-
    proxmox_guest_net.proxmox_vms[0].network | default([])
    | selectattr('name', 'equalto', 'eth0') | selectattr('inet', 'defined') | list | length > 0
  retries: 30
  delay: 5
  when: "'lxc' in group_names"

- name: Note the container's address
  ansible.builtin.set_fact:
    proxmox_guest_address: >-
      {{ (proxmox_guest_net.proxmox_vms[0].network | selectattr('name', 'equalto', 'eth0') | first).inet.split('/')[0] }}
  when: "'lxc' in group_names"

# The guest agent reports every interface; pick the IPv4 on the one with our MAC.
- name: Wait for the VM's address
  community.proxmox.proxmox_vm_info:
    vmid: "{{ vmid }}"
    config: current
    network: true
  register: proxmox_guest_net
  until: >-
    proxmox_guest_net.proxmox_vms[0].network | default([])
    | selectattr('hardware-address', 'equalto', proxmox_guest_mac | lower)
    | map(attribute='ip-addresses') | flatten
    | selectattr('ip-address-type', 'equalto', 'ipv4') | list | length > 0
  retries: 60
  delay: 5
  when: "'vm' in group_names"

- name: Note the VM's address
  ansible.builtin.set_fact:
    proxmox_guest_address: >-
      {{ proxmox_guest_net.proxmox_vms[0].network
      | selectattr('hardware-address', 'equalto', proxmox_guest_mac | lower)
      | map(attribute='ip-addresses') | flatten
      | selectattr('ip-address-type', 'equalto', 'ipv4')
      | map(attribute='ip-address') | first }}
  when: "'vm' in group_names"

- name: Wait for SSH
  ansible.builtin.wait_for:
    host: "{{ proxmox_guest_address }}"
    port: 22
    timeout: 300
  check_mode: false

- name: Read the host key
  ansible.builtin.command:
    cmd: ssh-keyscan -q -t ed25519 -T 5 {{ proxmox_guest_address }}
  register: proxmox_guest_keyscan
  changed_when: false
  check_mode: false
  until: proxmox_guest_keyscan.stdout_lines | select('search', ' ssh-ed25519 ') | list | length > 0
  retries: 12
  delay: 5

- name: Report the address and host key
  ansible.builtin.debug:
    msg:
      - "address (ansible_host): {{ proxmox_guest_address }}"
      - "known_hosts: {{ inventory_hostname }} {{ (proxmox_guest_keyscan.stdout_lines | select('search', ' ssh-ed25519 ') | first).split()[1:3] | join(' ') }}"
      - "rollback: net0 back to hwaddr {{ mac_temp }} with ip=dhcp"
