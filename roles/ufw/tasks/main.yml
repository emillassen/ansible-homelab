---
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Deny incoming by default
  community.general.ufw:
    direction: incoming
    default: deny
  when: not ansible_check_mode or 'ufw' in ansible_facts.packages

- name: Allow outgoing by default
  community.general.ufw:
    direction: outgoing
    default: allow
  when: not ansible_check_mode or 'ufw' in ansible_facts.packages

- name: Set the routed default
  community.general.ufw:
    direction: routed
    default: "{{ ufw_routed }}"
  when: not ansible_check_mode or 'ufw' in ansible_facts.packages

- name: Allow SSH from the admin sources
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    to_port: "22"
    proto: tcp
  loop: "{{ ufw_ssh_sources }}"
  when: not ansible_check_mode or 'ufw' in ansible_facts.packages

# One rule per port and source; `from` is one address or a list (default: anyone).
- name: Allow the service ports
  community.general.ufw:
    rule: allow
    from_ip: "{{ item.from }}"
    to_port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop: "{{ ufw_allow_rules }}"
  loop_control:
    label: "{{ item.port }}/{{ item.proto }} from {{ item.from }}"
  when: not ansible_check_mode or 'ufw' in ansible_facts.packages

- name: Read the rules ufw holds
  ansible.builtin.command: ufw show added
  register: ufw_added
  changed_when: false
  check_mode: false
  when: not ansible_check_mode or 'ufw' in ansible_facts.packages

# A port that gained a `from` still has its old open-to-anyone rule. Only delete what is
# there: a delete of a missing rule reports changed under --check.
- name: Remove the open rule of a port that is now limited
  community.general.ufw:
    rule: allow
    from_ip: any
    to_port: "{{ item.port | string }}"
    proto: "{{ item.proto }}"
    delete: true
  loop: "{{ ufw_allow | selectattr('from', 'defined') | rejectattr('from', 'equalto', 'any') | list }}"
  loop_control:
    label: "{{ item.port }}/{{ item.proto }}"
  when:
    - ufw_added is not skipped
    - ('ufw allow ' ~ item.port ~ '/' ~ item.proto) in ufw_added.stdout_lines

- name: Enable ufw
  community.general.ufw:
    state: enabled
  when: not ansible_check_mode or 'ufw' in ansible_facts.packages
