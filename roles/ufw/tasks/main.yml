---
# Default deny without these, and pruning, would lock Ansible out.
- name: Check that SSH has sources
  ansible.builtin.assert:
    that: ufw_ssh_sources | length > 0
    fail_msg: ufw_ssh_sources is empty for {{ inventory_hostname }}

- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Deny incoming by default
  community.general.ufw:
    direction: incoming
    default: deny
  when: not ansible_check_mode or 'ufw' in ansible_facts.packages

- name: Allow outgoing by default
  community.general.ufw:
    direction: outgoing
    default: allow
  when: not ansible_check_mode or 'ufw' in ansible_facts.packages

- name: Set the routed default
  community.general.ufw:
    direction: routed
    default: "{{ ufw_routed }}"
  when: not ansible_check_mode or 'ufw' in ansible_facts.packages

- name: Allow SSH from the admin sources
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    to_port: "22"
    proto: tcp
  loop: "{{ ufw_ssh_sources }}"
  when: not ansible_check_mode or 'ufw' in ansible_facts.packages

# One rule per port and source; `from` is one address or a list (default: anyone).
- name: Allow the service ports
  community.general.ufw:
    rule: allow
    from_ip: "{{ item.from }}"
    to_port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop: "{{ ufw_allow_rules }}"
  loop_control:
    label: "{{ item.port }}/{{ item.proto }} from {{ item.from }}"
  when: not ansible_check_mode or 'ufw' in ansible_facts.packages

- name: Read the rules ufw holds
  ansible.builtin.command: ufw show added
  register: ufw_added
  changed_when: false
  check_mode: false
  when: not ansible_check_mode or 'ufw' in ansible_facts.packages

# The role owns the ruleset: a rule nobody declares any more (a port taken out of
# ufw_allow, a source taken out of `from`, an open rule for a port that gained a `from`)
# is deleted. Only what is there: a delete of a missing rule reports changed under --check.
- name: Remove the rules nobody declares
  community.general.ufw:
    rule: allow
    from_ip: "{{ item.from }}"
    to_port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    delete: true
  loop: "{{ ufw_extra }}"
  loop_control:
    label: "{{ item.port }}/{{ item.proto }} from {{ item.from }}"
  when: ufw_added is not skipped

- name: Report rules in a shape this role doesn't write
  ansible.builtin.debug:
    msg: "Not deleted, delete by hand if unwanted: {{ ufw_unknown }}"
  when: ufw_added is not skipped and ufw_unknown | length > 0

- name: Enable ufw
  community.general.ufw:
    state: enabled
  when: not ansible_check_mode or 'ufw' in ansible_facts.packages
