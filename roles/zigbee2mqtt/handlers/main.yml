---
# Same guards as the start task, and skipped when that task has just started it, so an
# upgrade reconnects to the coordinator once and nothing runs before production.
- name: Restart zigbee2mqtt
  ansible.builtin.systemd_service:
    name: zigbee2mqtt
    state: restarted
    daemon_reload: true
  when:
    - not ansible_check_mode
    - net_production
    - zigbee2mqtt_config.stat.exists
    - zigbee2mqtt_service is not changed
